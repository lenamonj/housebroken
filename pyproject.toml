[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "housebroken-cli"
version = "0.21.0"
description = "Agent-written pull requests that do not make a mess in someone else's house."
dynamic = ["readme"]
license = "MIT"
authors = [{ name = "Jeff Lenamon" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["pull-request", "github", "open-source", "contributing", "ai-agent", "claude-code", "code-review", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Unix Shell",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
housebroken = "housebroken.cli:main"

[project.urls]
Repository = "https://github.com/lenamonj/housebroken"
Issues = "https://github.com/lenamonj/housebroken/issues"
Changelog = "https://github.com/lenamonj/housebroken/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/housebroken"]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "housebroken/scripts"
"bin/housebroken" = "housebroken/scripts/housebroken"
"skills/housebroken/SKILL.md" = "housebroken/skill/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
  "src/housebroken",
  "scripts",
  "bin/housebroken",
  "skills/housebroken/SKILL.md",
  "README.md",
  "LICENSE",
]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"
repo = "lenamonj/housebroken"
